[workspace]
resolver = "2"
members = [
    "crates/ailc-contracts",
    "crates/ailc-core",
    "crates/ailc-capabilities",
    "crates/ailc",
    # Оснастка тестов. Отдельный участник рабочей области, а не модуль внутри `ailc-core`,
    # намеренно: подключается ТОЛЬКО как dev-dependency, поэтому не попадает ни в поставляемый
    # бинарь, ни в снимок публичного контракта, ни в поверхность, которую разбирают
    # собственные проверки инструмента.
    "crates/ailc-testkit",
]

[workspace.package]
edition = "2021"
version = "0.7.0"
license = "Apache-2.0"

# Профиль release: плотный бинарь + защита IP (труднее реверсить).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# Раскрутка стека обязательна, а не факультативна. Изоляция сбоев в конвейере и гейте
# построена на `std::panic::catch_unwind` (pipeline.rs, gate.rs): паника одного детектора
# на необычном файле пользователя обязана давать пропуск этой проверки, а не завершать
# процесс. При `panic = "abort"` раскрутки не происходит, `catch_unwind` не перехватывает
# ничего, и любая паника обрывала сеанс MCP-сервера в среде разработки. Тем же обесценивалось
# обоснование безопасности блока `unsafe` в pipeline.rs, опирающееся на срабатывание
# защитного объекта при раскрутке. Прирост размера бинаря составляет доли процента и
# несопоставим с ценой падения сервиса.
panic = "unwind"
strip = true
