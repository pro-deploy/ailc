name: Release

# Собирает релизный бинарь ailc под все платформы и прикрепляет к релизу GitHub:
# Linux (x86_64, aarch64), macOS (Intel и Apple Silicon), Windows (x86_64), плюс
# установочные скрипты install.sh и install.ps1. После сборки бинарников публикует в
# реестр npm обёртку ailc-mcp той же версии (job publish-npm), чтобы GitHub-релиз и npm
# всегда поднимались одним пушем тега. Запускается на теге вида v* или вручную.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Токен OIDC нужен для подписи артефактов в режиме без ключей (cosign keyless):
  # закрытый ключ не создаётся и не хранится вовсе, вместо него удостоверяется личность
  # самого рабочего процесса, а факт подписи попадает в публичный журнал прозрачности.
  # Это снимает главный недостаток контрольной суммы, которая публикуется рядом с архивом
  # и потому подтверждает целостность загрузки, но не подлинность источника.
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Выпуск не начинается, пока не доказано, что код исправен. Прежде сборка выпуска шла
  # мимо тестов, поэтому в релиз мог уехать код с красными тестами.
  gate:
    name: Тесты и линтеры перед выпуском
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Инструментарий из rust-toolchain.toml
        run: rustup show && rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - name: Проверка форматирования
        run: cargo fmt --all -- --check
      - name: Clippy (предупреждения блокируют)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Тесты
        run: cargo test --workspace

  build:
    name: ${{ matrix.target }}
    needs: gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,   ext: tar.gz }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu,  ext: tar.gz }
          - { os: macos-latest,     target: x86_64-apple-darwin,        ext: tar.gz }
          - { os: macos-latest,     target: aarch64-apple-darwin,       ext: tar.gz }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,     ext: zip }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Сборка release
        run: cargo build --release --target ${{ matrix.target }} -p ailc

      - name: Упаковка (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="ailc-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "target/${{ matrix.target }}/release" ailc
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Упаковка (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "ailc-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/ailc.exe" -DestinationPath $archive -Force
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $archive" | Out-File -Encoding ascii "$archive.sha256"

      - name: Установить cosign
        uses: sigstore/cosign-installer@v3

      # Подпись без ключей: удостоверяется личность рабочего процесса (репозиторий, имя
      # процесса, тег), запись попадает в публичный журнал прозрачности Rekor. Рядом с
      # архивом публикуются подпись и сертификат, поэтому проверить подлинность может
      # любой, у кого установлен cosign, а хранить закрытый ключ никому не требуется.
      - name: Подписать архив
        shell: bash
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          archive="ailc-${{ matrix.target }}.${{ matrix.ext }}"
          cosign sign-blob --yes \
            --output-signature "$archive.sig" \
            --output-certificate "$archive.pem" \
            "$archive"

      # Расширение архива задано в матрице, поэтому перечисляются ровно те файлы, которые
      # действительно собраны на этой платформе, и отсутствие файла является ошибкой.
      # Прежде список включал оба расширения и потому требовал fail_on_unmatched_files: false,
      # из-за чего сорванная упаковка молча давала выпуск без вложений.
      - name: Прикрепить к релизу
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            ailc-${{ matrix.target }}.${{ matrix.ext }}
            ailc-${{ matrix.target }}.${{ matrix.ext }}.sha256
            ailc-${{ matrix.target }}.${{ matrix.ext }}.sig
            ailc-${{ matrix.target }}.${{ matrix.ext }}.pem

  scripts:
    name: установочные скрипты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Прикрепить установщики к релизу
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            install.sh
            install.ps1

  publish-npm:
    name: публикация обёртки в npm
    # Идёт только по тегу и только после успешной сборки всех бинарников: к моменту
    # публикации ассеты релиза v<версия> уже на месте, поэтому npx ailc-mcp@<версия>
    # сразу найдёт бинарь и не упрётся в 404. Требует секрет репозитория NPM_TOKEN
    # (npm Automation-токен либо гранулярный токен с правом publish и обходом 2FA).
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Сверка версии тега с версией обёртки
        working-directory: npm/ailc-mcp
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::версия тега ($tag) не совпадает с версией обёртки ($pkg)"
            exit 1
          fi
          echo "версия согласована: $pkg"

      - name: Публикация в npm (идемпотентно)
        working-directory: npm/ailc-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pkg="$(node -p "require('./package.json').version")"
          if npm view "ailc-mcp@$pkg" version >/dev/null 2>&1; then
            echo "ailc-mcp@$pkg уже опубликован, пропускаю."
            exit 0
          fi
          npm publish --provenance --access public
